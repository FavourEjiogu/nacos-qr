name: One-time dependency refresh

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.pull_request.body, '<!-- dependency-upgrade -->')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: migration/supabase-postgres
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Upgrade patched runtime and test dependencies
        run: |
          npm install next@^16.4.1 react@^19.3.1 react-dom@^19.3.1 lucide-react@^1.61.0 qrcode.react@^4.2.0 --no-audit --no-fund
          npm uninstall --save-dev eslint-config-next @eslint/eslintrc --no-audit --no-fund
          npm install --save-dev eslint@^10 @eslint/js@^10 vitest@^5.0.5 @types/react@^19 @types/react-dom@^19 --no-audit --no-fund

      - name: Confirm dependency security
        run: npm audit --audit-level=high

      - name: Run quality gates before publishing the lockfile
        run: |
          npm run lint
          npm test
          npm run build

      - name: Publish reviewed dependency manifest and lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependencies already match the audited lockfile."
          else
            git commit -m "Upgrade patched dependencies and regenerate package lock"
            TOKEN_B64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${TOKEN_B64}" push origin HEAD:migration/supabase-postgres
          fi
